# ============================================================
# Operational settings (probes, metrics, logs, shutdown).
# Imported by application.properties AND by the test
# application.properties, so tests run with the same setup.
# ============================================================

# --- Health probes -------------------------------------------
# Same paths as every other service in the platform:
#   GET /health  liveness  - is the JVM alive? (never checks MongoDB, so a
#                            database blip does not restart every pod)
#   GET /ready   readiness - can we serve traffic? (includes MongoDB)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/health
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoint.health.group.readiness.additional-path=server:/ready

# --- Metrics ---------------------------------------------------
# Only the Prometheus endpoint is exposed over HTTP (GET /actuator/prometheus);
# env, beans, heapdump ... stay disabled.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=identity-service

# --- Logs --------------------------------------------------------
# One JSON object per line on stdout (Elastic Common Schema), shipped to
# Loki by Grafana Alloy. Built into Spring Boot - no extra library.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=identity-service
logging.level.root=${LOG_LEVEL:INFO}

# --- Graceful shutdown ------------------------------------------
# On SIGTERM (rolling update) stop accepting requests, let in-flight ones
# finish for up to 20s, then exit - inside Kubernetes' 30s grace period.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
