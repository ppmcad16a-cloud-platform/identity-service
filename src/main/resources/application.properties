spring.application.name=identity-service
spring.config.import=classpath:operations.properties

server.port=${PORT:3101}
# Spring Boot 4 name (was spring.data.mongodb.uri). Must include the
# database name at the end of the URI: .../mern_ecommerce
spring.mongodb.uri=${MONGO_URI}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Path prefix routes are mounted under, e.g. BASE_API_URL=api -> /api/...
# Read straight from the environment by the ${BASE_API_URL:api} placeholder
# in each @RequestMapping (default "api"). It must NOT be re-declared here as
# BASE_API_URL=${BASE_API_URL:api} - Spring 7 rejects that self-reference
# as a circular placeholder and the app fails to start.

# (spring.jackson.serialization.write-dates-as-timestamps=false was removed:
# Spring Boot 4 uses Jackson 3, which already writes dates as ISO-8601
# strings by default and no longer accepts that property.)
