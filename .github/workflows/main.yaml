# ============================================================
# Identity Service CI
#
# This file is intentionally tiny. The real pipeline lives in
# ppmcad16a-cloud-platform/core-cloud-platform and is shared
# by every service, so all services follow the same standards.
#
# @v1 = tested release of the shared workflows (see the
#       "Versioning" section of the core-cloud-platform README).
# ============================================================

name: Identity Service CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch/PR cancels the older run
# (saves CI minutes, gives faster feedback).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job below.
permissions:
  contents: read

jobs:

  # Build, test (coverage gate) and - if enabled - build + scan
  # the container image.
  build:
    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/java-app.yaml@v1
    with:
      java-version: "21"
      build-docker: true
      image-name: identity-service
      # TEMPORARY (until Phase 2): Spring Boot 3.3.5 ships ~40 fixable
      # HIGH/CRITICAL CVEs. Phase 2 upgrades it, then this line is REMOVED
      # so the vulnerability gate blocks the build again.
      fail-on-vulnerabilities: false

  # Scan the whole git history for leaked secrets.
  secret-scan:
    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/security-scan.yaml@v1
